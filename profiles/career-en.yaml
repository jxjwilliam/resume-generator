summary: 'Senior full-stack engineer with 20+ years shipping production systems in React/Next.js, Node.js, and Python (FastAPI)
  for SaaS and cloud-based apps — the last several years focused on integrating LLMs and multimedia AI (vision, audio, multimodal
  workflows) into real products: agentic AI, RAG pipelines/ LLM-Wiki, multi-agent workflows, and AI-assisted automation. Comfortable
  owning a service end-to-end — API design, data layer, ETL, cloud deployment (AWS, Kubernetes) — and AI integration on top
  of it. Built and scaled systems processing hundreds of millions of events/year; player-coach leader across North America
  and Asia; bilingual English/Mandarin.

  '
