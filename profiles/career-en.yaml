  - architecture
  body: '{opening}

    At Best IT Consulting Inc. and Xperi, I have owned the full lifecycle of production AI systems — from LLM provider selection
    and RAG pipeline architecture through Kubernetes deployment and post-launch monitoring. For Shaanxi Coal & Chemical Industry
    Group, I designed and shipped a multi-LLM orchestration system integrating OpenAI, Claude, and OSS models with enterprise
    document repositories using Python FastAPI, LangChain, and vector databases — handling real-time inference at enterprise
