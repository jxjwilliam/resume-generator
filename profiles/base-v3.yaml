# ─── COVER LETTER TEMPLATES ───────────────────────────────────

cover_letters:
  - id: "ai-principal-focused"
    label: "Principal AI Engineer / AI Lead roles"
    tags: [ai, llm, rag, agentic, python, mlops, architecture]
    body: >
      {opening}

      At Best IT Consulting Inc. and Xperi, I have owned the full lifecycle
      of production AI systems — from LLM provider selection and RAG pipeline
      architecture through Kubernetes deployment and post-launch monitoring.
      For Shaanxi Coal & Chemical Industry Group, I designed and shipped a
      multi-LLM orchestration system integrating OpenAI, Claude, and OSS
      models with enterprise document repositories using Python FastAPI,
      LangChain, and vector databases — handling real-time inference at
      enterprise scale.

      I bring deep expertise in agentic multi-agent systems (CrewAI),
      prompt and context engineering, and MLOps — alongside the full-stack
      TypeScript/React skills to deliver complete AI products end-to-end.
      I actively build and maintain open-source AI projects: memweaver
      (long-term agent memory), idea2spec (spec-driven AI development),
      agenticAP (AP automation), and jinyong-finetune (LoRA fine-tuning).

      {closing}

  - id: "ml-engineering-focused"
    label: "ML Engineering / MLOps / AI Platform roles"
    tags: [ml, mlops, python, kubeflow, gpu, pipeline, devops]
    body: >
      {opening}

      At Xperi, I led the design and delivery of MLDP — a production ML
      data pipeline platform managing model experiments, distributed GPU
      scheduling, and training workflows at a scale of hundreds of millions
      of inference events annually. The platform ran on Kubernetes across
      AWS and GCP, with Kubeflow for orchestration, Weights & Biases for
      experiment tracking, and Prometheus for GPU/CPU observability.

      My hands-on Python expertise spans FastAPI, LangChain, Hugging Face
      Transformers, and LoRA fine-tuning — complemented by strong
      infrastructure skills in Docker, Kubernetes, CI/CD, and cloud-native
      architecture. I am equally comfortable defining ML system architecture
      and staying deep in the codebase.

      {closing}

