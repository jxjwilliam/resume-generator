    label: "Backend / API / Platform roles"
    tags: [backend, python, node, api, devops, microservices]
    body: >
      {opening}

      In my most recent roles at Xperi and Best IT Consulting Inc., I have
      combined hands-on Python and TypeScript engineering with architectural
      leadership to deliver enterprise-scale systems. I have designed and
      shipped event-driven microservices and API-first platforms using
      Python FastAPI, Node.js, and Java Spring Boot — with a strong focus
      on scalability, observability, and production reliability.

      My infrastructure experience spans Kubernetes on AWS and GCP, Docker,
      Jenkins CI/CD, and MLOps pipelines. I have built real-time data
      integration systems, optimized high-throughput APIs, and owned
      cloud-native deployments from architecture through production.

      {closing}

